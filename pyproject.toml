[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "napi-config"
version = "16.0.0"
description = "NAPI board configuration with shared core, TUI and CLI"
requires-python = ">=3.9"
dependencies = ["PyYAML>=5.4"]

[project.scripts]
napi-config = "napi_config.cli.app:main"

[tool.setuptools.packages.find]
include = ["napi_config*"]

[tool.setuptools.data-files]
"share/napi-config" = ["boards.yaml", "platforms.yaml"]
